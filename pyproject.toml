[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-trading-cockpit"
version = "0.1.0"
description = "Local ICT trading analysis, journaling, and execution cockpit"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
